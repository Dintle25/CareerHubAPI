# Runs tests on every push to main and every pull request targeting main.
# Uses Node 20 with npm caching to keep installs fast.

name: CI

on:
  push:
    branches: [main, assignment_front_3.2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Node 20 with npm cache pointed at the client package-lock.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: careerhub-frontend/package-lock.json

      # Install dependencies inside the client directory
      - name: Install dependencies
        working-directory: careerhub-frontend
        run: npm ci --legacy-peer-deps

      # Run tests in CI mode (exits after one run, no watch mode)
      - name: Run tests
        working-directory: careerhub-frontend
        run: npm run test:run